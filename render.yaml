services:
  - type: web
    name: campusshare-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: campusshare-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://campusshare.vercel.app,http://localhost:5173"
      - key: STORAGE_MODE
        value: "local"

databases:
  - name: campusshare-postgres
    plan: free
    region: oregon
    postgresMajorVersion: 16

